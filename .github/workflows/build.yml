name: Build KQLValidator

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            executable: KQLValidator
          - os: windows-latest
            runtime: win-x64
            executable: KQLValidator.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        run: dotnet publish KQLValidator/KQLValidator.csproj -c Release -r ${{ matrix.runtime }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish/${{ matrix.runtime }}

      - name: Smoke test published executable (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x publish/${{ matrix.runtime }}/${{ matrix.executable }}
          publish/${{ matrix.runtime }}/${{ matrix.executable }} tests/smoke/basic-datatable-where.kql

      - name: Smoke test published executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "publish/${{ matrix.runtime }}/${{ matrix.executable }}" "tests/smoke/basic-datatable-where.kql"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kqlvalidator-${{ matrix.runtime }}
          path: publish/${{ matrix.runtime }}/${{ matrix.executable }}
